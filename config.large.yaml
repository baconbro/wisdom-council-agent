# Wisdom Council Agent - Large Deployment Track
# RAM Requirement: 128GB per model
# Target: High-performance production environments
# Copy to config.yaml and customize for your environment

# =============================================================================
# DEPLOYMENT TRACK: LARGE
# =============================================================================
deployment:
  track: "large"
  ram_per_model: "128GB"
  description: "High-performance deployment for maximum quality"
  use_case: "Enterprise production, research, maximum quality requirements"

# =============================================================================
# COUNCIL CONFIGURATION
# =============================================================================
council:
  # Maximum rounds of debate between council heads
  max_debate_rounds: 3

  # Threshold for consensus (0.0 - 1.0)
  # Higher = more agreement required
  consensus_threshold: 0.8

  # Maximum time for council deliberation (seconds)
  timeout_seconds: 300

  # Enable verbose logging of deliberations
  verbose: true

# =============================================================================
# COUNCIL HEADS - LARGE TRACK (128GB RAM per model)
# =============================================================================
heads:
  # THE ARCHITECT
  # Role: Logic, precision, systematic planning
  # Model: Qwen3 110B (fits in ~110GB RAM with 4-bit quantization)
  architect:
    enabled: true
    model: "qwen3:110b"
    provider: "ollama"  # ollama, openai, anthropic, together
    temperature: 0.1
    max_tokens: 8192
    quantization: "q4_K_M"  # 4-bit quantization (~70-90GB RAM)
    context_length: 131072  # 128K context
    rope_scaling: true  # Enable for extended context
    constitution:
      - "Optimize for efficiency and measurability"
      - "Prefer proven methods over experimental ones"
      - "Ensure all outputs are actionable and specific"
      - "Minimize resource usage while maximizing output"
      - "Every plan must have clear success criteria"
    system_prompt: |
      You are the Architect. Your role is to provide rigorous, logical,
      systematic analysis. You focus on:
      - Feasibility and constraints
      - Optimal resource allocation
      - Clear metrics and milestones
      - Risk quantification

      Challenge vague thinking. Demand specificity.
      Your output must always include: steps, timeline, resources, risks.

  # THE ORACLE
  # Role: Wisdom, intuition, human-centered perspective
  # Model: Qwen3 110B (same as Architect, different temperature)
  oracle:
    enabled: true
    model: "qwen3:110b"
    provider: "ollama"
    temperature: 0.8
    max_tokens: 8192
    quantization: "q4_K_M"
    context_length: 131072
    rope_scaling: true
    constitution:
      - "Consider the human behind the request"
      - "Look beyond stated needs to underlying needs"
      - "Value wisdom over mere correctness"
      - "Consider long-term consequences"
      - "Simplicity often beats complexity"
    system_prompt: |
      You are the Oracle. Your role is to provide wisdom, intuition,
      and human-centered perspective. You focus on:
      - What does the human REALLY need?
      - What are they not saying?
      - What could go wrong emotionally/politically?
      - Is there a simpler path?

      Challenge assumptions. Ask "why?" and "for whom?"
      Your output must always include: human considerations,
      potential blind spots, alternative framings.

  # THE GUARDIAN
  # Role: Safety, ethics, risk assessment
  # Model: Llama 4 Maverick 70B (high-quality safety model, ~70GB RAM)
  guardian:
    enabled: true
    model: "llama4:maverick-70b"
    provider: "ollama"
    temperature: 0.3
    max_tokens: 4096
    quantization: "q4_K_M"
    context_length: 65536  # 64K context
    veto_power: true  # Can block plans that violate constitution
    constitution:
      - "First, do no harm"
      - "Protect privacy and confidentiality"
      - "Ensure ethical alignment"
      - "Flag potential negative consequences"
      - "Verify alignment with stated values"
    system_prompt: |
      You are the Guardian. Your role is to ensure safety, ethics,
      and alignment. You focus on:
      - Could this cause harm?
      - Are there privacy/security concerns?
      - Does this align with user's values?
      - What are the worst-case scenarios?

      You have VETO power on any plan that violates your constitution.
      Your output must always include: risks identified, ethical review,
      recommended safeguards.

  # THE SYNTHESIZER
  # Role: Merge perspectives into balanced action
  # Model: Qwen3 110B (same as Architect/Oracle)
  synthesizer:
    enabled: true
    model: "qwen3:110b"
    provider: "ollama"
    temperature: 0.4
    max_tokens: 8192
    quantization: "q4_K_M"
    context_length: 131072
    rope_scaling: true
    system_prompt: |
      You are the Synthesizer. Your role is to merge diverse perspectives
      into balanced, actionable plans. You focus on:
      - What is the best of each perspective?
      - How can apparent conflicts be resolved?
      - What trade-offs are we making and why?

      Never simply average or compromise. Synthesize into something better.
      Your output must always include: what was incorporated from each head,
      how conflicts were resolved, final reasoning.

# =============================================================================
# EXECUTION LAYER - SUB-AGENTS (LARGE TRACK)
# =============================================================================
execution:
  # Default executor model
  # Model: Qwen3 72B (high-quality execution, ~80GB RAM)
  executor_model: "qwen3:72b"

  # Maximum parallel sub-agent calls
  max_parallel_agents: 4

  # Sub-agent timeout (seconds)
  agent_timeout: 180

  sub_agents:
    # RESEARCH AGENT
    research:
      enabled: true
      model: "qwen3:72b"
      provider: "ollama"
      temperature: 0.3
      quantization: "q4_K_M"
      context_length: 65536
      tools:
        - "web_search"
        - "document_reader"
        - "database_query"
      system_prompt: |
        You are a Research Agent. Your job is to:
        - Gather comprehensive information
        - Verify facts from multiple sources
        - Structure findings clearly
        Return: JSON with sources, findings, confidence scores.

    # ANALYST AGENT
    analyst:
      enabled: true
      model: "qwen3:72b"
      provider: "ollama"
      temperature: 0.2
      quantization: "q4_K_M"
      context_length: 65536
      tools:
        - "python_repl"
        - "calculator"
        - "chart_generator"
      system_prompt: |
        You are an Analyst Agent. Your job is to:
        - Perform quantitative analysis
        - Calculate metrics and scores
        - Identify patterns and risks
        Return: Analysis results, visualizations, recommendations.

    # CODER AGENT
    # Using DeepSeek Coder V2 236B for specialized coding tasks
    coder:
      enabled: true
      model: "deepseek-coder-v2:236b"
      provider: "ollama"
      temperature: 0.1
      quantization: "q4_K_M"
      context_length: 65536
      tools:
        - "file_writer"
        - "code_executor"
        - "test_runner"
        - "linter"
      system_prompt: |
        You are a Coder Agent. Your job is to:
        - Write clean, tested code
        - Follow best practices
        - Document your code
        Return: Files created, test results, any warnings.

    # WRITER AGENT
    writer:
      enabled: true
      model: "qwen3:72b"
      provider: "ollama"
      temperature: 0.6
      quantization: "q4_K_M"
      context_length: 65536
      tools:
        - "document_creator"
        - "formatter"
        - "grammar_checker"
      system_prompt: |
        You are a Writer Agent. Your job is to:
        - Create clear, professional documents
        - Adapt tone to audience
        - Structure content logically
        Return: Document content, formatting applied, readability score.

# =============================================================================
# MEMORY CONFIGURATION
# =============================================================================
memory:
  # Memory provider
  provider: "mem0"

  # Short-term memory (session)
  short_term:
    backend: "redis"
    host: "localhost"
    port: 6379
    ttl_seconds: 7200  # 2 hours for large track

  # Long-term memory (persistent)
  long_term:
    backend: "qdrant"
    host: "localhost"
    port: 6333
    collection: "wisdom_council_large"

  # Memory extraction settings
  extraction:
    model: "qwen3:72b"
    min_importance_score: 0.7

  # Retention policy
  retention:
    max_memories: 20000  # More memories for large track
    decay_days: 120

# =============================================================================
# CONTEXT MANAGEMENT
# =============================================================================
context:
  # Maximum context window usage (tokens)
  max_tokens: 120000  # Near max for large models

  # Trigger compression at this threshold
  compression_threshold: 100000

  # Rolling summary max size
  summary_max_tokens: 3000

  # Compression model
  compression_model: "qwen3:72b"

# =============================================================================
# CHECKPOINTING
# =============================================================================
checkpointing:
  enabled: true

  # Storage backend: sqlite, redis, postgres
  storage: "postgres"  # Use Postgres for large track

  # PostgreSQL connection
  postgres:
    host: "localhost"
    port: 5432
    database: "wisdom_council_large"
    user: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"

  # Save frequency (every N steps)
  frequency: 3  # More frequent checkpoints for large track

  # Save before risky operations
  checkpoint_before_tools: true

  # Maximum checkpoints per thread
  max_checkpoints_per_thread: 30

# =============================================================================
# HUMAN-IN-THE-LOOP
# =============================================================================
human_approval:
  enabled: true

  # Actions that require approval
  require_approval:
    - "external_communication"
    - "file_deletion"
    - "database_modification"
    - "high_risk_action"

  # Approval timeout (seconds)
  timeout: 600  # Longer timeout for large track

  # Default action on timeout: "approve", "reject", "escalate"
  timeout_action: "escalate"  # Escalate instead of reject

# =============================================================================
# OBSERVABILITY
# =============================================================================
observability:
  # LangSmith integration
  langsmith:
    enabled: true  # Enable for large track
    api_key: "${LANGSMITH_API_KEY}"
    project: "wisdom-council-large"

  # Logging
  logging:
    level: "DEBUG"  # More detailed logging
    format: "json"  # json, text
    file: "./logs/wisdom_council_large.log"

  # Metrics
  metrics:
    enabled: true
    export_interval: 30  # More frequent metrics
    prometheus:
      enabled: true
      port: 9090

# =============================================================================
# API SERVER
# =============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  workers: 8  # More workers for large track

  # CORS
  cors:
    enabled: true
    origins: ["*"]

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 120  # Higher limits

# =============================================================================
# MODEL PROVIDER SETTINGS
# =============================================================================
providers:
  ollama:
    host: "http://localhost:11434"
    timeout: 300  # Longer timeout for large models
    num_gpu: 4  # Recommend 4 GPUs for large models

  openai:
    api_key: "${OPENAI_API_KEY}"
    organization: "${OPENAI_ORG_ID}"

  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"

  together:
    api_key: "${TOGETHER_API_KEY}"

  # vLLM for high-performance inference
  vllm:
    enabled: true
    host: "http://localhost:8001"
    tensor_parallel_size: 4

# =============================================================================
# RESOURCE CONSTRAINTS
# =============================================================================
resources:
  # Memory limits
  max_ram_per_model: "128GB"
  total_system_ram_recommended: "512GB"

  # GPU requirements
  gpu_vram_recommended: "80GB"  # Per GPU (e.g., A100, H100)
  gpu_count: 4
  tensor_parallel: true

  # CPU fallback
  cpu_threads: 32
  use_cpu_fallback: false  # Disable CPU fallback for large track

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
performance:
  # Batch processing
  batch_size: 16

  # Model caching
  cache_models: true
  model_cache_size: 3  # Keep 3 models in memory

  # Parallel processing
  enable_parallel_heads: true

  # KV cache optimization
  use_flash_attention: true
  use_paged_attention: true

  # Quantization settings
  quantization:
    method: "q4_K_M"  # 4-bit with KV cache optimization
    group_size: 128
    use_exllama: true  # ExLlama for faster inference

  # Speculative decoding
  speculative_decoding:
    enabled: true
    draft_model: "qwen3:14b"
    num_speculative_tokens: 5

# =============================================================================
# ADVANCED FEATURES
# =============================================================================
advanced:
  # Multi-GPU distribution
  pipeline_parallel: true
  pipeline_stages: 2

  # Model offloading
  cpu_offload:
    enabled: false  # Disable for large track
    offload_layers: 0

  # Mixed precision
  mixed_precision:
    enabled: true
    compute_dtype: "bfloat16"
    weight_dtype: "int4"

  # Custom CUDA optimizations
  cuda:
    compile_mode: "max-autotune"
    use_triton: true
